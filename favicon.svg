<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base HUD oscura con borde táctico -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#hudGrad)" stroke-width="2.5" />

  <!-- Retícula arquitectónica sutil -->
  <line x1="12" y1="14" x2="52" y2="14" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="12" y1="50" x2="52" y2="50" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Chasis del mando retro / nodo de ingeniería -->
  <rect x="9" y="19" width="46" height="26" rx="8" fill="#0b1324" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" />

  <!-- Cruceta (D-Pad) pixel-art a la izquierda -->
  <path d="M 19 27 H 23 V 30 H 26 V 34 H 23 V 37 H 19 V 34 H 16 V 30 H 19 Z" fill="#34d399" />

  <!-- Conector central de plano UML / flujo ágil -->
  <line x1="29" y1="29" x2="35" y2="29" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
  <line x1="29" y1="35" x2="35" y2="35" stroke="#facc15" stroke-width="2" stroke-linecap="round" />

  <!-- Botones de acción arcade a la derecha -->
  <circle cx="42" cy="34" r="3" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="48" cy="29" r="3" fill="#facc15" filter="url(#glow)" />
</svg>
